<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Formulario de compra de entradas</title>
        <meta charset="utf-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="entradas.css" rel="stylesheet" type="text/css">
        <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
 

        <meta name="viewport" content="width=device-width, initial-scale=1">

    </head>
    <body>
        <section>
            <h1> COMPRA DE ENTRADAS</h1>
           <h2> ENTRADAS PARA LAS PRÓXIMAS EDICIONES</h2>
            <form onsubmit  ="return comprar()">
                <label for="nombre">NOMBRE:</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre" required>
                <input type="email" id="correo" placeholder="Escribe tu correo" required>
               <!-- (para el desplegable) -->
               <label for="exposicion">Exposición:</label>
               <select id="exposicion">
                <option value="e1">Lollapalooza Barcelona</option>
                <option value="e2">Lollapalooza Madrid</option>
                <option value="e3">Lollapalooza Sevilla</option>
               </select>
               <label for="numero">Número de entradas</label>
               <input type="number" id="numero" min="1" max="10"
                placeholder="Número de entradas" required onchange="costeTotal()">
               <p>Coste total de las entradas: <span id="coste"></span></p>
               <input type="submit" value="Comprar entradas">
            </form>
        </section>
        <div id="modal">
            <div>
                <h2>La compra se ha realizado correctamente</h2>
                <ul>
                    <li>Nombre: <span id="nom"></span></li>
                    <li>Correo electrónico: <span id="co"></span></li>
                    <li>Exposición: <span id="ex"></span></li>
                    <li>Número de entradas: <span id="num"></span></li>
                    <li>Coste total: <span id="ct"></span></li>
                </ul>
                <button onclick="cerrarVentana()">Aceptar</button>
            </div>
        </div>
        <figure> <img src="imagentrada/fondoentradas.png" alt="imágenes"></figure>
        <script src="entradasjs/entradas.js"></script>
    </body>
</html>
